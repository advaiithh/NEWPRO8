# Tamil cache intents (script: Tamil). Matched by character similarity (static English embeddings cannot embed Tamil).
- id: ta_greeting
  lang: ta
  q: [வணக்கம், வணக்கம் நண்பா, ஹலோ, வாங்க, வணக்கம் எப்படி இருக்கிறீர்கள்]
  a: ["வணக்கம்! நான் உங்களுக்கு எப்படி உதவலாம்?"]
- id: ta_how_are_you
  lang: ta
  q: [நீங்கள் எப்படி இருக்கிறீர்கள், எப்படி இருக்கிறாய், நலமா, சுகமா, நீங்கள் நலமா]
  a: ["நான் நலமாக இருக்கிறேன், நன்றி. நீங்கள் எப்படி இருக்கிறீர்கள்?"]
- id: ta_name
  lang: ta
  q: [உங்கள் பெயர் என்ன, உன் பெயர் என்ன, நீங்கள் யார், நீ யார், உங்களை அறிமுகப்படுத்துங்கள்]
  a: ["என் பெயர் பாக்கெட் வாய்ஸ். நான் இணையம் இல்லாமல் உங்கள் கணினியில் இயங்கும் குரல் உதவியாளர்."]
- id: ta_thanks
  lang: ta
  q: [நன்றி, மிக்க நன்றி, நன்றி நண்பா, ரொம்ப நன்றி, மிகவும் நன்றி]
  a: ["மகிழ்ச்சி! எப்போது வேண்டுமானாலும் கேளுங்கள்."]
- id: ta_goodbye
  lang: ta
  q: [போய் வருகிறேன், பிறகு சந்திக்கலாம், வருகிறேன், சரி நான் கிளம்புகிறேன்,மீண்டும் சந்திப்போம்]
  a: ["சரி, மீண்டும் சந்திப்போம்!"]
- id: ta_joke
  lang: ta
  q: [ஒரு நகைச்சுவை சொல்லுங்கள், ஜோக் சொல்லு, என்னை சிரிக்க வையுங்கள், ஒரு சிரிப்பு சொல்லுங்கள், நகைச்சுவை சொல்லு]
  a: ["ஆசிரியர் கேட்டார், உலகிலேயே வேகமானது எது? மாணவன் சொன்னான், தேர்வு முடிவு வருவதற்கு முன் இருக்கும் பயம்!"]
- id: ta_good_morning
  lang: ta
  q: [காலை வணக்கம், குட் மார்னிங், இனிய காலை வணக்கம், காலை வணக்கம் நண்பா]
  a: ["காலை வணக்கம்! உங்கள் நாள் இனிதாக அமையட்டும்."]
- id: ta_good_night
  lang: ta
  q: [இனிய இரவு, குட் நைட், நான் தூங்கப் போகிறேன், இரவு வணக்கம், இனிய இரவு வணக்கம்]
  a: ["இனிய இரவு! நன்றாக உறங்குங்கள்."]
- id: ta_capabilities
  lang: ta
  q: [நீங்கள் என்ன செய்ய முடியும், உங்களால் என்ன செய்ய முடியும், எனக்கு எப்படி உதவ முடியும், என்ன செய்வாய், உங்களால் என்ன முடியும்]
  a: ["நான் உரையாடலாம், கேள்விகளுக்குப் பதில் சொல்லலாம். இவை அனைத்தும் இணையம் இல்லாமல் உங்கள் கணினியிலேயே நடக்கும்."]
- id: ta_offline
  lang: ta
  q: [இணையம் தேவையா, இணையம் இல்லாமல் வேலை செய்வாயா, நீங்கள் இணையத்தில் இருக்கிறீர்களா, இணைய இணைப்பு வேண்டுமா]
  a: ["நான் முழுவதும் இணையம் இல்லாமல் இந்தக் கருவியிலேயே இயங்குகிறேன்."]
- id: ta_language
  lang: ta
  q: [உங்களுக்கு தமிழ் தெரியுமா, தமிழில் பேசுவீர்களா, நீங்கள் எந்த மொழி பேசுவீர்கள், உனக்கு தமிழ் தெரியுமா]
  a: ["ஆம், நான் தமிழ், இந்தி மற்றும் ஆங்கிலம் பேசுவேன்."]
- id: ta_made_by
  lang: ta
  q: [உங்களை யார் உருவாக்கினார்கள், உன்னை யார் செய்தது, உங்களை உருவாக்கியவர் யார்]
  a: ["நான் ஒரு எட்ஜ் ஏஐ ஹேக்கத்தானுக்காக உருவாக்கப்பட்ட, இணையம் இல்லாமல் இயங்கும் குரல் உதவியாளர்."]
- id: ta_help
  lang: ta
  q: [எனக்கு உதவி செய்யுங்கள், உதவி வேண்டும், எனக்கு உதவுங்கள், எனக்கு உதவி தேவை]
  a: ["நிச்சயமாக. உங்களுக்கு என்ன உதவி வேண்டும்?"]
