# Main benchmark requests. kind: skill | cache | open.
# skill: `expect` = regex that the reply must match. cache: `intent` = intent id that should answer
# (cache requests are paraphrases, deliberately NOT copies of pv/router/intents.yaml entries).
# open: `any` = at least one keyword must appear in the reply (quality rubric, lower-case).
# lang hi: Hindi, spoken with the hi_IN Piper voice.
- {id: s01, kind: skill, text: "what time is it right now", expect: "\\d{1,2}:\\d{2}"}
- {id: s02, kind: skill, text: "tell me the current time", expect: "\\d{1,2}:\\d{2}"}
- {id: s03, kind: skill, text: "what is today's date", expect: "20\\d\\d"}
